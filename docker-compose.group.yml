
# グループ会社インスタンス用 PostgreSQL + Redis。
# 自社の docker-compose.yml とはコンテナ名・ポート・ボリュームを完全に分離する。
# 起動: docker compose -f docker-compose.group.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: machcore-group-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-machcore_group}
      POSTGRES_USER:     ${POSTGRES_USER:-machcore_group}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-machcore_group_pass}
      TZ: Asia/Tokyo
    volumes:
      - postgres_group_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-machcore_group}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: machcore-group-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_group_pass} --save 60 1
    ports:
      - "6391:6379"
    volumes:
      - redis_group_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_group_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_group_data:
  redis_group_data:
